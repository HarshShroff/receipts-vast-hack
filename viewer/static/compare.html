<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Receipts — model comparison</title>
<link rel="stylesheet" href="static/style.css"/>
<link rel="stylesheet" href="static/compare.css"/>
</head>
<body>
<header>
  <h1>Receipts <span class="thin">model comparison</span></h1>
  <p class="sub nav"><a href="./">Clip viewer</a> · same labeled questions, every system.
    Results are read from <code id="resfile">eval/out/results_real.json</code>; nothing here calls a model.</p>
</header>
<main>
  <section>
    <h2>Summary <span class="meta" id="n"></span></h2>
    <div class="scroll"><table id="summary"></table></div>
    <p class="meta" id="label"></p>
    <details class="notes"><summary>Run notes</summary><ul id="notes"></ul></details>
  </section>

  <section class="player">
    <div class="stage cmp"><video id="v" controls playsinline preload="metadata" muted></video></div>
    <div class="nowbar"><span class="mono" id="clock">–</span> <span class="meta" id="playing"></span></div>
  </section>

  <section>
    <h2>Questions <span class="meta">click ▶ to play the footage up to the question time</span></h2>
    <div class="legend" id="legend"></div>
    <div id="questions"></div>
  </section>
</main>
<script src="static/compare.js"></script>
</body>
</html>
